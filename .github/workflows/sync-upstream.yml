---
name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    uses: hermeto-fullsend/workflows/.github/workflows/sync-upstream.yml@main
    with:
      upstream_repo: hermetoproject/hermeto
    secrets: inherit
